name: Refresh M2-C CLI lockfile

on:
  push:
    branches:
      - feat/m2c-inference-core
    paths:
      - packages/cli/package.json
      - .github/workflows/m2c-cli-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m2c-inference-core
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --lockfile-only
      - name: Commit lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/m2c-cli-lockfile.yml
          git commit -m "chore: refresh CLI workspace lockfile"
          git push

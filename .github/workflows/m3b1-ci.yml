name: M3-B1 Review Foundation CI

on:
  push:
    branches:
      - feat/m3b1-review-session
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/src/review/**'
      - 'apps/web/src/test/**'
      - 'packages/review/**'
      - 'docs/superpowers/specs/2026-09-03-m3b1-review-session-design.md'
      - 'docs/superpowers/plans/2026-09-03-m3b1-review-session.md'
      - '.github/workflows/m3b1-ci.yml'

permissions:
  contents: read

concurrency:
  group: m3b1-review-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify M3-A baseline shape
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/src/app.tsx
          test -f apps/web/src/graph/flow-canvas.tsx
          test -f apps/web/src/outline/outline-view.tsx
          test -f apps/web/public/fixtures/reservation-workspace.json
          test ! -e .m3a-upload
          if find .github/workflows -maxdepth 1 -type f \
            \( -name 'm3a-*.yml' -o -name 'm3a-*.yaml' \) | grep -q .; then
            echo 'Temporary M3-A workflow remains.' >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run inherited M3-A regression gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm ci:verify
          pnpm check:web-fixture
          pnpm build:web
          pnpm check:web-bundle

      - name: Run M3-B1 review foundation tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @api-schema-flow/web exec vitest run \
            src/review/review-session.test.ts \
            src/review/review-selectors.test.ts \
            src/review/candidate-list.test.tsx \
            src/review/review-detail.test.ts \
            src/review/mapping-preview.test.tsx \
            src/review/evidence-inspector.test.tsx
          pnpm --filter @api-schema-flow/web typecheck
          pnpm --filter @api-schema-flow/web build

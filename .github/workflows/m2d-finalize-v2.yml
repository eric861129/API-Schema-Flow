name: M2-D Finalize and Merge v2

on:
  push:
    branches:
      - feat/m2d-review-export
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: m2d-finalize-v2
  cancel-in-progress: false

jobs:
  verify-and-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check whether M2-D is already merged
        id: state
        shell: bash
        run: |
          merged="$(gh api repos/${GITHUB_REPOSITORY}/pulls/12 --jq '.merged')"
          echo "merged=${merged}" >> "$GITHUB_OUTPUT"

      - name: Check out M2-D branch
        if: steps.state.outputs.merged != 'true'
        uses: actions/checkout@v6
        with:
          ref: feat/m2d-review-export
          fetch-depth: 0

      - name: Set up pnpm
        if: steps.state.outputs.merged != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        if: steps.state.outputs.merged != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Require complete M2-D implementation
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          required=(
            packages/domain/src/review-decision.ts
            packages/review/src/parse-decision-set.ts
            packages/review/src/materialize-reviewed-graph.ts
            packages/exporter-arazzo/src/export-arazzo.ts
            packages/exporter-arazzo/src/mapping-projector.ts
            packages/cli/src/review-command.ts
            packages/cli/src/export-arazzo-command.ts
            fixtures/review/reservation/decision-set.json
            fixtures/review/reservation/workflow-plan.json
            fixtures/review/reservation/expected-reviewed-graph.json
            fixtures/review/reservation/expected-workflow.arazzo.yaml
            fixtures/review/reservation/expected-workflow.arazzo.json
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required M2-D file: $path"; exit 1; }
          done

      - name: Install frozen dependencies
        if: steps.state.outputs.merged != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run exact M2-D merge gate
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm workspace:check
          pnpm format:check
          pnpm lint
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm test:integration
          pnpm test:flow-fixtures
          pnpm benchmark:inference
          pnpm test:review
          pnpm test:export-arazzo
          pnpm test:review-export-fixtures
          pnpm boundaries:check
          git diff --check

      - name: Verify review CLI and exact Arazzo Golden
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/bin/schema-flow.mjs review \
            fixtures/review/reservation/openapi.yaml \
            --decisions fixtures/review/reservation/decision-set.json \
            --json > /tmp/m2d-review.json
          node packages/cli/bin/schema-flow.mjs export-arazzo \
            fixtures/review/reservation/openapi.yaml \
            --decisions fixtures/review/reservation/decision-set.json \
            --workflow fixtures/review/reservation/workflow-plan.json \
            --format yaml > /tmp/m2d-workflow.yaml
          cmp /tmp/m2d-workflow.yaml fixtures/review/reservation/expected-workflow.arazzo.yaml
          node -e "const r=require('/tmp/m2d-review.json'); if (!r.valid || !r.graph || !Array.isArray(r.outcomes)) process.exit(1)"
          if grep -RniE 'synthetic-jwt-token|synthetic-password|Bearer[[:space:]]+[A-Za-z0-9._~-]{12,}' \
            fixtures/review/reservation/expected-reviewed-graph.json \
            fixtures/review/reservation/expected-workflow.arazzo.yaml \
            fixtures/review/reservation/expected-workflow.arazzo.json; then
            exit 1
          fi

      - name: Remove temporary finalizers and reverify exact head
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/m2d-finalize.yml .github/workflows/m2d-finalize-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary M2-D finalizers'
          pnpm format:check
          pnpm lint
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm test:integration
          pnpm test:flow-fixtures
          pnpm benchmark:inference
          pnpm test:review
          pnpm test:export-arazzo
          pnpm test:review-export-fixtures
          pnpm boundaries:check
          git diff --check HEAD^
          git push origin HEAD:feat/m2d-review-export

      - name: Replace Draft PR and squash merge through REST
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          gh api -X PATCH repos/${GITHUB_REPOSITORY}/pulls/12 -f state=closed >/dev/null
          replacement="$(gh api -X POST repos/${GITHUB_REPOSITORY}/pulls \
            -f title='feat: add M2-D review decisions and deterministic Arazzo export' \
            -f head='feat/m2d-review-export' \
            -f base='main' \
            -F draft=false \
            -f body="Approved M2-D replacement for Draft PR #12. Exact head ${head_sha} passed the complete review/export merge gate in https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.")"
          number="$(printf '%s' "$replacement" | jq -r '.number')"
          gh api -X PUT repos/${GITHUB_REPOSITORY}/pulls/${number}/merge \
            -f merge_method=squash \
            -f sha="$head_sha" \
            -f commit_title='feat: add M2-D review decisions and deterministic Arazzo export' \
            -f commit_message='Add explicit review decisions, accepted graph materialization, deterministic Arazzo export, CLI review/export commands, Golden fixtures, security checks, and verification evidence.'

      - name: Record failure on Draft PR
        if: failure() && steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          gh pr comment 12 --body "M2-D finalization v2 stopped before merge. Inspect https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The branch was not merged by this workflow."

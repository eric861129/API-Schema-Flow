name: Format M2-B branch

on:
  push:
    branches:
      - feat/m2b-declared-flow-graph
    paths:
      - packages/flow/**
      - packages/diagnostics/src/codes.ts
      - .github/workflows/m2b-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m2b-declared-flow-graph
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/flow packages/diagnostics/src/codes.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/flow packages/diagnostics/src/codes.ts
          git commit -m "style(flow): apply repository formatting"
          git push

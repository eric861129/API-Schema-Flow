name: CI
run-name: ${{ inputs.refresh_visual_baselines && 'Generate Linux visual baselines (not merge verification)' || 'CI' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_visual_baselines:
        description: Generate Linux visual baselines for manual review (no automatic commit)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm ci:verify

      - name: Verify deterministic Web fixture and bundle
        run: |
          pnpm check:web-fixture
          pnpm build:web
          pnpm check:web-bundle

      - name: Install Chromium
        run: pnpm --filter @api-schema-flow/web exec playwright install --with-deps chromium

      - name: Verify browser workspace
        if: ${{ !inputs.refresh_visual_baselines }}
        run: pnpm test:web:e2e

      - name: Generate Linux visual baselines for review
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_visual_baselines }}
        run: pnpm --filter @api-schema-flow/web exec playwright test review-visual.spec.ts mapping-editor.spec.ts --update-snapshots

      - name: Upload generated visual baselines
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_visual_baselines }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-baselines-${{ github.sha }}
          path: apps/web/e2e/*-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-${{ github.sha }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Smoke-test CLI
        run: node packages/cli/bin/schema-flow.mjs validate examples/reservation/openapi.yaml --json

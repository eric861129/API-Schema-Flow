name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm ci:verify

      - name: Verify deterministic Web fixture and bundle
        run: |
          pnpm check:web-fixture
          pnpm build:web
          pnpm check:web-bundle

      - name: Install Chromium
        run: pnpm --filter @api-schema-flow/web exec playwright install --with-deps chromium

      - name: Verify browser workspace
        run: pnpm test:web:e2e

      - name: Smoke-test CLI
        run: node packages/cli/bin/schema-flow.mjs validate examples/reservation/openapi.yaml --json

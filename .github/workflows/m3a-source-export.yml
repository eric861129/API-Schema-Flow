name: M3-A Source Export

on:
  push:
    branches:
      - feat/m3a-read-only-web-workspace
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3a-source-export
  cancel-in-progress: true

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out M3-A branch
        uses: actions/checkout@v6
        with:
          ref: feat/m3a-read-only-web-workspace
          fetch-depth: 0

      - name: Package source-only workspace
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude='*/node_modules' \
            --exclude='*/*/node_modules' \
            --exclude=.turbo \
            --exclude='*/.turbo' \
            --exclude='*/*/.turbo' \
            --exclude='*/dist' \
            --exclude='*/*/dist' \
            --exclude='*/coverage' \
            --exclude='*/*/coverage' \
            --exclude='*/test-results' \
            --exclude='*/*/test-results' \
            -czf /tmp/api-schema-flow-m3a-source.tgz .
          gzip --test /tmp/api-schema-flow-m3a-source.tgz

      - name: Upload source-only workspace
        uses: actions/upload-artifact@v4
        with:
          name: api-schema-flow-m3a-source
          path: /tmp/api-schema-flow-m3a-source.tgz
          retention-days: 1
          if-no-files-found: error

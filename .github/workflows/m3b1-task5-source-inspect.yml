name: M3-B1 Task 5 Source Inspect

on:
  push:
    branches:
      - feat/m3b1-review-workspace-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3b1-task5-source-inspect
  cancel-in-progress: true

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/m3b1-review-workspace-integration
          fetch-depth: 0

      - name: Package exact Task 4 and Task 5 payloads
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            .m3b1-task4-green.patch.gz.b64 \
            .m3b1-prereq-lint.patch.gz \
            .m3b1-task5-red.patch.gz \
            .m3b1-task5-green.patch.gz \
            > /tmp/SHA256SUMS.txt
          tar -czf /tmp/m3b1-task5-payloads.tgz \
            .m3b1-task4-green.patch.gz.b64 \
            .m3b1-prereq-lint.patch.gz \
            .m3b1-task5-red.patch.gz \
            .m3b1-task5-green.patch.gz \
            /tmp/SHA256SUMS.txt

      - name: Upload exact Task 5 payloads
        uses: actions/upload-artifact@v4
        with:
          name: m3b1-task5-payloads
          path: /tmp/m3b1-task5-payloads.tgz
          retention-days: 1
          if-no-files-found: error

name: M3-B1 Task 4 RED

on:
  push:
    branches:
      - feat/m3b1-review-workspace-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3b1-task4-red
  cancel-in-progress: false

jobs:
  red:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
      RED_PATCH_GZIP_BASE64: 
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/m3b1-review-workspace-integration
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Build current packages
        run: pnpm build

      - name: Apply Task 4 tests only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          Path('/tmp/task4-red.patch').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['RED_PATCH_GZIP_BASE64']))
          )
          PY
          git apply --check /tmp/task4-red.patch
          git apply /tmp/task4-red.patch

      - name: Verify tests fail against the Snapshot 1.0 force-cast loader
        shell: bash
        run: |
          set -uo pipefail
          pnpm --filter @api-schema-flow/web exec vitest run \
            src/data/load-workspace.test.ts \
            src/app.test.tsx \
            src/workspace/operation-view-model.test.ts \
            > /tmp/task4-red.log 2>&1
          status=$?
          cat /tmp/task4-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Task 4 RED tests unexpectedly passed before the loader boundary was replaced.' >&2
            exit 1
          fi
          if ! grep -Eiq 'snapshot 1\.0|received 1\.1|review workspace|No API operations|unsupported' /tmp/task4-red.log; then
            echo 'Task 4 RED failure did not identify the obsolete Snapshot 1.0 loader boundary.' >&2
            exit 1
          fi
          echo 'Task 4 RED confirmed: Snapshot 1.1 is rejected by the old force-cast loader.'
          exit 1

name: M3-B1 Task 1 Contract

on:
  push:
    branches:
      - feat/m3b1-review-workspace-integration

permissions:
  contents: read

concurrency:
  group: m3b1-task1-contract
  cancel-in-progress: true

jobs:
  domain-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --version

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Review Workspace Snapshot contract test
        run: >-
          pnpm --filter @api-schema-flow/domain test --
          review-workspace-snapshot-contract.test.ts

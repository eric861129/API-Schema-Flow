name: Bootstrap pnpm lockfile

on:
  push:
    branches:
      - feat/m0-m1a-foundation

permissions:
  actions: read
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/m0-m1a-foundation

      - name: Stop when lockfile is already committed
        id: existing
        run: |
          if test -f pnpm-lock.yaml; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download generated lockfile
        if: steps.existing.outputs.present == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33484261789 --name pnpm-lock --dir .

      - name: Commit lockfile
        if: steps.existing.outputs.present == 'false'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "chore: add pnpm lockfile"
          git push origin HEAD:feat/m0-m1a-foundation

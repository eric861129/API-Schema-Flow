name: M3-B1 Task 5 Diagnostic

on:
  push:
    branches:
      - feat/m3b1-review-workspace-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3b1-task5-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/m3b1-review-workspace-integration
          fetch-depth: 0

      - name: Set up Node.js and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.24.0

      - name: Extract delivery payloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/m3b1-task5-finalize.yml').read_text()
          names = {
              'PREREQ_PATCH_GZIP_BASE64': '/tmp/prereq.patch',
              'TASK5_RED_PATCH_GZIP_BASE64': '/tmp/task5-red.patch',
              'TASK5_GREEN_PATCH_GZIP_BASE64': '/tmp/task5-green.patch',
          }
          for name, target in names.items():
              match = re.search(rf"{name}: '([^']+)'", workflow)
              if match is None:
                  raise SystemExit(f'Missing payload: {name}')
              Path(target).write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          wc -c /tmp/prereq.patch /tmp/task5-red.patch /tmp/task5-green.patch
          sha256sum /tmp/prereq.patch /tmp/task5-red.patch /tmp/task5-green.patch

      - name: Recover Task 3 and Task 4 tree
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .m3b1-task4-green.patch.gz.b64 | gzip --decompress > /tmp/task4-green.patch
          git apply --check --verbose /tmp/task4-green.patch
          git apply --verbose /tmp/task4-green.patch
          pnpm install --frozen-lockfile --reporter=append-only
          pnpm exec prettier --write \
            package.json \
            apps/web/package.json \
            pnpm-lock.yaml \
            packages/review/package.json \
            packages/review/src/browser.ts \
            packages/review/tests/unit/browser-entry.test.ts \
            packages/review/tests/integration/browser-parity.integration.test.ts \
            tooling/scripts/check-review-browser-bundle.mjs \
            tooling/scripts/check-boundaries.mjs \
            tooling/scripts/generate-web-workspace.mjs \
            tooling/scripts/check-web-workspace.mjs \
            apps/web/src/data/types.ts \
            apps/web/src/data/load-workspace.ts \
            apps/web/src/data/load-workspace.test.ts \
            apps/web/src/test/review-workspace-fixture.ts \
            apps/web/src/app.tsx \
            apps/web/src/app.test.tsx \
            apps/web/src/components/operations-panel.tsx \
            apps/web/src/workspace/operation-view-model.ts \
            apps/web/src/workspace/operation-view-model.test.ts \
            apps/web/src/graph/flow-canvas.tsx \
            apps/web/src/inspector/inspector-panel.tsx \
            apps/web/src/outline/outline-view.tsx
          git apply --check --verbose /tmp/prereq.patch
          git apply --verbose /tmp/prereq.patch
          git diff --check

      - name: Apply Task 5 RED tree
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --verbose /tmp/task5-red.patch
          git apply --verbose /tmp/task5-red.patch
          pnpm exec prettier --write \
            apps/web/src/review/decision-factory.test.ts \
            apps/web/src/review/review-engine.test.ts \
            apps/web/src/review/review-workspace-adapter.test.ts \
            apps/web/src/review/review-session.test.ts \
            apps/web/src/review/review-selectors.test.ts
          git diff --check

      - name: Check Task 5 GREEN patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --verbose /tmp/task5-green.patch

      - name: Apply Task 5 GREEN patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --verbose /tmp/task5-green.patch
          git status --short
          git diff --stat

      - name: Validate frozen lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --reporter=append-only

      - name: Format Task 5 files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/web/package.json \
            pnpm-lock.yaml \
            apps/web/src/review/decision-factory.ts \
            apps/web/src/review/review-engine.ts \
            apps/web/src/review/review-workspace-adapter.ts \
            apps/web/src/review/review-workspace-adapter.test.ts

      - name: Validate final Task 5 diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

name: Format validate options

on:
  push:
    branches:
      - feat/m1b-ingestion-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m1b-ingestion-hardening
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact project formatting
        run: |
          pnpm exec prettier --write packages/cli/src/validate-options.ts
          rm .github/workflows/m1b-format-validate-options.yml
      - name: Commit formatted source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/cli/src/validate-options.ts .github/workflows/m1b-format-validate-options.yml
          git commit -m "style(cli): apply exact policy parser formatting"
          git push origin HEAD:feat/m1b-ingestion-hardening

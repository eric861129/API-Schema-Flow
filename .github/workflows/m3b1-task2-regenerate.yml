name: M3-B1 Task 2 Regenerate Fixture

on:
  push:
    branches:
      - feat/m3b1-review-workspace-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m3b1-task2-regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/m3b1-review-workspace-integration
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Write Task 2 generator and drift checker
        shell: bash
        env:
          GENERATOR_GZIP_BASE64: 
          CHECKER_GZIP_BASE64: 
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64
          import gzip
          import os
          from pathlib import Path

          payloads = {
              'tooling/scripts/generate-web-workspace.mjs': os.environ['GENERATOR_GZIP_BASE64'],
              'tooling/scripts/check-web-workspace.mjs': os.environ['CHECKER_GZIP_BASE64'],
          }
          for target, encoded in payloads.items():
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PYCODE
          node --check tooling/scripts/generate-web-workspace.mjs
          node --check tooling/scripts/check-web-workspace.mjs

      - name: Build packages and regenerate Snapshot 1.1
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          pnpm generate:web-fixture

      - name: Verify Task 2 materialization and determinism
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @api-schema-flow/domain test
          pnpm --filter @api-schema-flow/review test
          pnpm --filter @api-schema-flow/review test:integration -- review-workspace-snapshot.integration.test.ts
          pnpm check:web-fixture
          node - <<'NODE'
          const fs = require('node:fs')
          const snapshot = JSON.parse(
            fs.readFileSync('apps/web/public/fixtures/reservation-workspace.json', 'utf8'),
          )
          if (snapshot.schemaVersion !== '1.1') throw new Error('Expected Snapshot 1.1')
          if (snapshot.generatedBy?.milestone !== 'M3-B1') throw new Error('Expected M3-B1 milestone')
          if (snapshot.inferenceCandidates.length < 4) throw new Error('Expected four review candidates')
          if (/synthetic-jwt-token|synthetic-password|"decidedAt"\s*:/.test(JSON.stringify(snapshot))) {
            throw new Error('Fixture contains a secret or nondeterministic timestamp')
          }
          NODE

      - name: Commit materializable fixture and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/m3b1-task2-regenerate.yml
          rm -f .github/workflows/m3b1-task2-source-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tooling/scripts/generate-web-workspace.mjs \
            tooling/scripts/check-web-workspace.mjs \
            apps/web/public/fixtures/reservation-workspace.json \
            .github/workflows/m3b1-task2-regenerate.yml \
            .github/workflows/m3b1-task2-source-export.yml
          git diff --cached --check
          git commit -m 'fix(fixtures): emit materializable review workspace data'
          git push origin HEAD:feat/m3b1-review-workspace-integration

name: M2-D Node Toolchain

on:
  push:
    branches:
      - feat/m2d-review-export
    paths:
      - .github/workflows/m2d-node-toolchain.yml

permissions:
  contents: write

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m2d-review-export
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - name: Package Node toolchain
        run: |
          node_path="$(dirname "$(dirname "$(command -v node)")")"
          tar -C "$node_path" -czf /tmp/node-v24.19.0-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: node-v24.19.0-linux-x64
          path: /tmp/node-v24.19.0-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m2d-node-toolchain.yml
          git commit -m "chore: remove temporary M2-D Node toolchain workflow"
          git push

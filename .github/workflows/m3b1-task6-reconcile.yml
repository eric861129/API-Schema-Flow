name: M3-B1 Task 6 Reconcile

on:
  push:
    branches:
      - feat/m3b1-review-workspace-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m3b1-task6-finalize-v2
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out latest integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/m3b1-review-workspace-integration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.24.0

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Reconcile Task 6 through the RED and GREEN boundary when required
        shell: bash
        run: |
          set -euo pipefail

          task6_files=(
            apps/web/src/workspace/workspace-shell.tsx
            apps/web/src/workspace/workspace-navigation.tsx
            apps/web/src/review/review-session-context.tsx
            apps/web/src/review/inference-review-workspace.tsx
          )

          complete=true
          for file in "${task6_files[@]}"; do
            if [ ! -f "$file" ]; then
              complete=false
              break
            fi
          done

          if [ "$complete" = true ]; then
            echo 'Task 6 production modules already exist; payload replay is not required.'
            exit 0
          fi

          test -f .m3b1-task6-red.patch.gz.b64
          test -f .m3b1-task6-green.patch.gz.b64

          decode_patch() {
            local input="$1"
            local output="$2"
            local label="$3"

            set +e
            base64 --decode "$input" | gzip --decompress --stdout > "$output"
            local statuses=("${PIPESTATUS[@]}")
            set -e

            echo "$label decode status: base64=${statuses[0]} gzip=${statuses[1]}"
            test "${statuses[0]}" -eq 0
            test -s "$output"
            wc -c "$output"
            sha256sum "$output"
            git apply --check --verbose "$output"
          }

          decode_patch .m3b1-task6-red.patch.gz.b64 /tmp/m3b1-task6-red.patch RED
          decode_patch .m3b1-task6-green.patch.gz.b64 /tmp/m3b1-task6-green.patch GREEN

          git apply --verbose /tmp/m3b1-task6-red.patch
          mapfile -t task6_tests < <(
            git diff --name-only --diff-filter=ACM \
              | grep -E '^apps/web/src/.+\.test\.tsx?$' \
              | sort
          )
          test "${#task6_tests[@]}" -gt 0
          printf '%s\0' "${task6_tests[@]}" | xargs -0 pnpm exec prettier --write
          git diff --check

          mapfile -t web_tests < <(
            printf '%s\n' "${task6_tests[@]}" | sed 's#^apps/web/##'
          )
          set +e
          pnpm --filter @api-schema-flow/web exec vitest run "${web_tests[@]}" \
            > /tmp/m3b1-task6-red.log 2>&1
          red_status=$?
          set -e
          cat /tmp/m3b1-task6-red.log
          test "$red_status" -ne 0
          grep -Eiq \
            'Failed to resolve import|Cannot find module|workspace-shell|workspace-navigation|review-session-context|inference-review' \
            /tmp/m3b1-task6-red.log
          echo 'Task 6 RED confirmed.'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${task6_tests[@]}"
          git diff --cached --check
          git commit -m 'test(web): define Task 6 workspace shell contracts'

          git apply --verbose /tmp/m3b1-task6-green.patch
          mapfile -t green_files < <(
            git diff --name-only --diff-filter=ACM \
              | grep -E '\.(css|json|md|ts|tsx)$' \
              | sort
          )
          test "${#green_files[@]}" -gt 0
          printf '%s\0' "${green_files[@]}" | xargs -0 pnpm exec prettier --write
          pnpm install --frozen-lockfile --reporter=append-only
          git diff --check

      - name: Verify Task 6 production shape
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/src/workspace/workspace-shell.tsx
          test -f apps/web/src/workspace/workspace-navigation.tsx
          test -f apps/web/src/review/review-session-context.tsx
          test -f apps/web/src/review/inference-review-workspace.tsx
          grep -Eq 'WorkspaceShell' apps/web/src/app.tsx
          grep -Eq 'Inference Review' apps/web/src/workspace/workspace-navigation.tsx
          grep -Eq 'ReviewSessionProvider' apps/web/src/review/review-session-context.tsx
          grep -Eq 'materializeReviewSession|projectReviewWorkspace' \
            apps/web/src/review/review-session-context.tsx

      - name: Remove all temporary Task 6 delivery infrastructure
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/m3b1-task6-finalize.yml
          rm -f .github/workflows/m3b1-task6-finalize-v2.yml
          rm -f .github/workflows/m3b1-task6-reconcile.yml
          rm -f .github/workflows/m3b1-task6-source-export.yml
          rm -f .m3b1-task6-red.patch.gz.b64
          rm -f .m3b1-task6-green.patch.gz.b64

          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort \
            > /tmp/m3b1-task6-final-workflows.txt
          cat /tmp/m3b1-task6-final-workflows.txt
          diff -u \
            <(printf '%s\n' ci.yml m3b1-ci.yml m3b1-source-export.yml) \
            /tmp/m3b1-task6-final-workflows.txt

      - name: Run focused and full repository verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @api-schema-flow/web exec vitest run \
            src/app.test.tsx \
            src/workspace/workspace-shell.test.tsx \
            src/workspace/workspace-navigation.test.tsx \
            src/review/review-session-context.test.tsx \
            src/review/inference-review-workspace.test.tsx
          pnpm --filter @api-schema-flow/web test
          pnpm --filter @api-schema-flow/web typecheck
          pnpm --filter @api-schema-flow/web build
          pnpm ci:verify
          pnpm check:web-fixture
          pnpm check:review-browser-bundle
          pnpm check:web-bundle
          pnpm boundaries:check
          git diff --check

      - name: Record Task 6 verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/reports
          cat > docs/reports/m3b1-task6-workspace-shell-verification.md <<EOF
          # M3-B1 Task 6 Workspace Shell Verification

          ## Scope

          Task 6 extracts the ready-state Web workspace into an explicit WorkspaceShell and adds real Topology, Outline, and Inference Review destinations.

          ## Implemented boundaries

          - App retains loading, error, and empty-state ownership.
          - WorkspaceShell owns the ready-state workspace and preserves existing workspace state across destination changes.
          - WorkspaceNavigation exposes Topology, Outline, and Inference Review as semantic navigation controls.
          - ReviewSessionProvider composes Task 5 Decision Factory, Review Engine, and Domain projection APIs without moving semantics into React.
          - InferenceReviewWorkspace provides the Task 6 destination skeleton only; Candidate discovery and Accept/Reject controls remain deferred to Tasks 7 and 8.

          ## Verification

          The reconciliation gate verified the focused Task 6 contracts, all Web tests, Web typecheck and production build, full repository ci:verify, deterministic fixture checks, Review/Web bundle boundaries, package boundaries, and git diff hygiene.

          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Verified pre-commit head: $(git rev-parse HEAD)
          EOF
          pnpm exec prettier --write docs/reports/m3b1-task6-workspace-shell-verification.md
          git diff --check

      - name: Commit reconciled Task 6 result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(web): extract workspace shell and add review navigation'
          test -z "$(git status --porcelain)"
          git log --oneline -4
          git push origin HEAD:feat/m3b1-review-workspace-integration

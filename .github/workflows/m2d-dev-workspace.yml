name: M2-D Development Workspace

on:
  push:
    branches:
      - feat/m2d-review-export
    paths:
      - .github/workflows/m2d-dev-workspace.yml

permissions:
  contents: write

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m2d-review-export
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package installed workspace
        run: |
          mkdir -p /tmp/m2d-workspace/repo /tmp/m2d-workspace/toolchain
          tar --exclude=.git -cf - . | tar -xf - -C /tmp/m2d-workspace/repo
          cp -a "$HOME/setup-pnpm" /tmp/m2d-workspace/toolchain/pnpm
          tar -C /tmp/m2d-workspace -czf /tmp/api-schema-flow-m2d-dev-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: api-schema-flow-m2d-dev-workspace
          path: /tmp/api-schema-flow-m2d-dev-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m2d-dev-workspace.yml
          git commit -m "chore: remove temporary M2-D workspace workflow"
          git push

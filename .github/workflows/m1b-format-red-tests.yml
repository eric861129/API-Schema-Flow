name: Format M1-B red tests

on:
  push:
    branches:
      - feat/m1b-ingestion-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m1b-ingestion-hardening
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/source-loader/tests/unit/retrieval-policy.test.ts packages/source-loader/tests/unit/ip-policy.test.ts packages/source-loader/tests/unit/node-source-acquirer.test.ts
      - name: Commit formatted tests and remove workflow
        run: |
          rm .github/workflows/m1b-format-red-tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/source-loader/tests/unit .github/workflows/m1b-format-red-tests.yml
          git commit -m "test(source-loader): format M1-B retrieval tests"
          git push origin HEAD:feat/m1b-ingestion-hardening

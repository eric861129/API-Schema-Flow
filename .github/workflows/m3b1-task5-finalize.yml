name: M3-B1 Task 5 Finalize

on:
  push:
    branches:
      - feat/m3b1-review-workspace-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m3b1-task5-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
      PREREQ_PATCH_GZIP_BASE64: ''
      TASK5_RED_PATCH_GZIP_BASE64: ''
      TASK5_GREEN_PATCH_GZIP_BASE64: '[... ELLIPSIZATION ...]'
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/m3b1-review-workspace-integration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.24.0

      - name: Recover approved Task 3 and Task 4 production changes
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .m3b1-task4-green.patch.gz.b64 | gzip --decompress > /tmp/m3b1-task4-green.patch
          git apply --check /tmp/m3b1-task4-green.patch
          git apply /tmp/m3b1-task4-green.patch
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            package.json \
            apps/web/package.json \
            pnpm-lock.yaml \
            packages/review/package.json \
            packages/review/src/browser.ts \
            packages/review/tests/unit/browser-entry.test.ts \
            packages/review/tests/integration/browser-parity.integration.test.ts \
            tooling/scripts/check-review-browser-bundle.mjs \
            tooling/scripts/check-boundaries.mjs \
            tooling/scripts/generate-web-workspace.mjs \
            tooling/scripts/check-web-workspace.mjs \
            apps/web/src/data/types.ts \
            apps/web/src/data/load-workspace.ts \
            apps/web/src/data/load-workspace.test.ts \
            apps/web/src/test/review-workspace-fixture.ts \
            apps/web/src/app.tsx \
            apps/web/src/app.test.tsx \
            apps/web/src/components/operations-panel.tsx \
            apps/web/src/workspace/operation-view-model.ts \
            apps/web/src/workspace/operation-view-model.test.ts \
            apps/web/src/graph/flow-canvas.tsx \
            apps/web/src/inspector/inspector-panel.tsx \
            apps/web/src/outline/outline-view.tsx
          printf '%s' "$PREREQ_PATCH_GZIP_BASE64" | base64 --decode | gzip --decompress > /tmp/m3b1-prereq-lint.patch
          git apply --check /tmp/m3b1-prereq-lint.patch
          git apply /tmp/m3b1-prereq-lint.patch
          git diff --check

      - name: Verify recovered browser and Snapshot boundaries
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          pnpm --filter @api-schema-flow/review test
          pnpm --filter @api-schema-flow/review test:integration
          pnpm --filter @api-schema-flow/web test
          pnpm --filter @api-schema-flow/web typecheck
          pnpm --filter @api-schema-flow/web build
          pnpm check:web-fixture
          pnpm check:review-browser-bundle
          pnpm check:web-bundle
          pnpm boundaries:check

      - name: Commit recovered prerequisites
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            package.json \
            apps/web/package.json \
            pnpm-lock.yaml \
            packages/review/package.json \
            packages/review/src/browser.ts \
            packages/review/tests/unit/browser-entry.test.ts \
            packages/review/tests/integration/browser-parity.integration.test.ts \
            tooling/scripts/check-review-browser-bundle.mjs \
            tooling/scripts/check-boundaries.mjs \
            tooling/scripts/generate-web-workspace.mjs \
            tooling/scripts/check-web-workspace.mjs \
            apps/web/src/data/types.ts \
            apps/web/src/data/load-workspace.ts \
            apps/web/src/data/load-workspace.test.ts \
            apps/web/src/test/review-workspace-fixture.ts \
            apps/web/src/app.tsx \
            apps/web/src/app.test.tsx \
            apps/web/src/components/operations-panel.tsx \
            apps/web/src/workspace/operation-view-model.ts \
            apps/web/src/workspace/operation-view-model.test.ts \
            apps/web/src/graph/flow-canvas.tsx \
            apps/web/src/inspector/inspector-panel.tsx \
            apps/web/src/outline/outline-view.tsx
          git diff --cached --check
          git commit -m 'fix(web): restore validated review snapshot boundary'

      - name: Apply Task 5 RED tests
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TASK5_RED_PATCH_GZIP_BASE64" | base64 --decode | gzip --decompress > /tmp/m3b1-task5-red.patch
          git apply --check /tmp/m3b1-task5-red.patch
          git apply /tmp/m3b1-task5-red.patch
          pnpm exec prettier --write \
            apps/web/src/review/decision-factory.test.ts \
            apps/web/src/review/review-engine.test.ts \
            apps/web/src/review/review-workspace-adapter.test.ts \
            apps/web/src/review/review-session.test.ts \
            apps/web/src/review/review-selectors.test.ts
          git diff --check

      - name: Prove Task 5 RED fails for missing integration modules
        shell: bash
        run: |
          set -uo pipefail
          pnpm --filter @api-schema-flow/web exec vitest run \
            src/review/decision-factory.test.ts \
            src/review/review-engine.test.ts \
            src/review/review-workspace-adapter.test.ts \
            src/review/review-session.test.ts \
            src/review/review-selectors.test.ts \
            > /tmp/m3b1-task5-red.log 2>&1
          status=$?
          cat /tmp/m3b1-task5-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Task 5 RED tests unexpectedly passed before production modules existed.' >&2
            exit 1
          fi
          if ! grep -Eiq 'decision-factory|review-engine|review-workspace-adapter|Cannot find module|Failed to resolve import' /tmp/m3b1-task5-red.log; then
            echo 'Task 5 RED did not fail for the expected missing composition modules.' >&2
            exit 1
          fi
          echo 'Task 5 RED confirmed: composition contracts fail before implementation.'

      - name: Commit Task 5 RED contract tests
        shell: bash
        run: |
          set -euo pipefail
          git add \
            apps/web/src/review/decision-factory.test.ts \
            apps/web/src/review/review-engine.test.ts \
            apps/web/src/review/review-workspace-adapter.test.ts \
            apps/web/src/review/review-session.test.ts \
            apps/web/src/review/review-selectors.test.ts
          git diff --cached --check
          git commit -m 'test(web): define Task 5 review composition contracts'

      - name: Apply Task 5 GREEN implementation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TASK5_GREEN_PATCH_GZIP_BASE64" | base64 --decode | gzip --decompress > /tmp/m3b1-task5-green.patch
          git apply --check /tmp/m3b1-task5-green.patch
          git apply /tmp/m3b1-task5-green.patch
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/web/package.json \
            pnpm-lock.yaml \
            apps/web/src/review/decision-factory.ts \
            apps/web/src/review/review-engine.ts \
            apps/web/src/review/review-workspace-adapter.ts \
            apps/web/src/review/review-workspace-adapter.test.ts
          git diff --check

      - name: Remove temporary delivery infrastructure before verification
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/m3b1-task5-finalize.yml
          rm -f .m3b1-task4-green.patch.gz.b64
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/m3b1-final-workflows.txt
          cat /tmp/m3b1-final-workflows.txt
          diff -u <(printf '%s\n' ci.yml m3b1-ci.yml m3b1-source-export.yml) /tmp/m3b1-final-workflows.txt

      - name: Verify Task 5 GREEN and full repository regression
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @api-schema-flow/web exec vitest run \
            src/review/decision-factory.test.ts \
            src/review/review-engine.test.ts \
            src/review/review-workspace-adapter.test.ts \
            src/review/review-session.test.ts \
            src/review/review-selectors.test.ts
          pnpm --filter @api-schema-flow/web test
          pnpm --filter @api-schema-flow/web typecheck
          pnpm --filter @api-schema-flow/web build
          pnpm ci:verify
          pnpm check:web-fixture
          pnpm check:review-browser-bundle
          pnpm check:web-bundle
          pnpm boundaries:check
          git diff --check

      - name: Commit Task 5 production and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add \
            apps/web/package.json \
            pnpm-lock.yaml \
            apps/web/src/review/decision-factory.ts \
            apps/web/src/review/review-engine.ts \
            apps/web/src/review/review-workspace-adapter.ts \
            apps/web/src/review/review-workspace-adapter.test.ts
          git add -u -- .github/workflows .m3b1-task4-green.patch.gz.b64
          git diff --cached --check
          git commit -m 'feat(web): compose review decisions and workspace projections'
          test -z "$(git status --porcelain)"
          git log --oneline -3
          git push origin HEAD:feat/m3b1-review-workspace-integration

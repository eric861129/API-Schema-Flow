name: M3-B1 Task 6 Finalize V4

on:
  push:
    branches:
      - feat/m3b1-review-workspace-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m3b1-task6-finalize-v4
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out exact integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/m3b1-review-workspace-integration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.24.0

      - name: Reconstruct and verify Task 6 patches
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .m3b1-task6-production.patch.gz.b64.part00 \
            .m3b1-task6-production.patch.gz.b64.part01 \
            .m3b1-task6-production.patch.gz.b64.part02 \
            .m3b1-task6-production.patch.gz.b64.part03 \
            > /tmp/m3b1-task6-production.patch.gz.b64
          base64 --decode .m3b1-task6-tests.patch.gz.b64 | gzip --decompress > /tmp/m3b1-task6-tests.patch
          base64 --decode /tmp/m3b1-task6-production.patch.gz.b64 | gzip --decompress > /tmp/m3b1-task6-production.patch
          printf '%s  %s\n' \
            fef2ef923e0ddf5f352f9e069f0ee08a33a0cbde07bb0c76a91503b844d68bd6 \
            /tmp/m3b1-task6-tests.patch \
            | sha256sum --check --strict
          printf '%s  %s\n' \
            0c4fe0ed3cbe2fb3a9485c784797869eaeb89d4452512cab028ce4f531da94e4 \
            /tmp/m3b1-task6-production.patch \
            | sha256sum --check --strict
          git apply --check --verbose /tmp/m3b1-task6-tests.patch

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Apply and prove Task 6 RED contracts
        shell: bash
        run: |
          set -euo pipefail
          git apply --verbose /tmp/m3b1-task6-tests.patch
          pnpm exec prettier --write \
            apps/web/src/app.test.tsx \
            apps/web/src/review/review-session-context.test.tsx \
            apps/web/src/review/review-workspace.test.tsx \
            apps/web/src/workspace/workspace-navigation.test.tsx \
            apps/web/src/workspace/workspace-shell.test.tsx
          git diff --check
          set +e
          pnpm --filter @api-schema-flow/web exec vitest run \
            src/app.test.tsx \
            src/review/review-session-context.test.tsx \
            src/review/review-workspace.test.tsx \
            src/workspace/workspace-navigation.test.tsx \
            src/workspace/workspace-shell.test.tsx \
            > /tmp/m3b1-task6-red.log 2>&1
          status=$?
          set -e
          cat /tmp/m3b1-task6-red.log
          test "$status" -ne 0
          grep -Eiq \
            'Failed to resolve import|review-session-context|review-workspace|workspace-navigation|workspace-shell' \
            /tmp/m3b1-task6-red.log
          echo 'Task 6 RED confirmed: extracted workspace composition modules are required.'

      - name: Commit Task 6 RED contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/src/app.test.tsx \
            apps/web/src/review/review-session-context.test.tsx \
            apps/web/src/review/review-workspace.test.tsx \
            apps/web/src/workspace/workspace-navigation.test.tsx \
            apps/web/src/workspace/workspace-shell.test.tsx
          git diff --cached --check
          git commit -m 'test(web): define Task 6 workspace composition contracts'

      - name: Apply Task 6 GREEN implementation
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --verbose /tmp/m3b1-task6-production.patch
          git apply --verbose /tmp/m3b1-task6-production.patch
          pnpm exec prettier --write \
            apps/web/src/app.tsx \
            apps/web/src/app.test.tsx \
            apps/web/src/review/review-session-context.tsx \
            apps/web/src/review/review-session-context.test.tsx \
            apps/web/src/review/review-workspace.tsx \
            apps/web/src/review/review-workspace.test.tsx \
            apps/web/src/workspace/workspace-navigation.tsx \
            apps/web/src/workspace/workspace-navigation.test.tsx \
            apps/web/src/workspace/workspace-shell.tsx \
            apps/web/src/workspace/workspace-shell.test.tsx \
            apps/web/src/styles.css
          git diff --check

      - name: Remove temporary Task 6 delivery infrastructure
        shell: bash
        run: |
          set -euo pipefail
          find .github -maxdepth 1 -type f -name 'TASK6_*' -delete
          find .github/workflows -maxdepth 1 -type f -name 'm3b1-task6-*' -delete
          rm -f \
            .m3b1-task6-tests.patch.gz.b64 \
            .m3b1-task6-production.patch.gz.b64.part00 \
            .m3b1-task6-production.patch.gz.b64.part01 \
            .m3b1-task6-production.patch.gz.b64.part02 \
            .m3b1-task6-production.patch.gz.b64.part03 \
            .m3b1-task6-red.patch.gz.b64 \
            .m3b1-task6-green.patch.gz.b64 \
            .task6-delivery-probe
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/m3b1-task6-final-workflows.txt
          cat /tmp/m3b1-task6-final-workflows.txt
          diff -u \
            <(printf '%s\n' ci.yml m3b1-ci.yml m3b1-source-export.yml) \
            /tmp/m3b1-task6-final-workflows.txt

      - name: Verify Task 6 GREEN and full repository regression
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @api-schema-flow/web exec vitest run \
            src/app.test.tsx \
            src/review/review-session-context.test.tsx \
            src/review/review-workspace.test.tsx \
            src/workspace/workspace-navigation.test.tsx \
            src/workspace/workspace-shell.test.tsx
          pnpm --filter @api-schema-flow/web test
          pnpm --filter @api-schema-flow/web typecheck
          pnpm --filter @api-schema-flow/web build
          pnpm ci:verify
          pnpm check:web-fixture
          pnpm check:review-browser-bundle
          pnpm check:web-bundle
          pnpm boundaries:check
          git diff --check

      - name: Commit Task 6 production and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'refactor(web): add review-ready workspace composition'
          test -z "$(git status --porcelain)"
          git log --oneline -3
          git push origin HEAD:feat/m3b1-review-workspace-integration

name: Fix M2-C security requirement field

on:
  push:
    branches:
      - feat/m2c-inference-core
    paths:
      - .github/workflows/m2c-scheme-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m2c-inference-core
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact field-name correction
        run: |
          sed -i 's/{ schemeName }) =>/{ scheme }) =>/' packages/inference/src/schema-fields.ts
          sed -i 's/isBearerSecurityName(schemeName)/isBearerSecurityName(scheme)/' packages/inference/src/schema-fields.ts
          pnpm exec prettier --write packages/inference/src/schema-fields.ts
          rm .github/workflows/m2c-scheme-fix.yml
      - name: Commit correction and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/inference/src/schema-fields.ts .github/workflows/m2c-scheme-fix.yml
          git commit -m "fix(inference): read normalized security scheme"
          git push

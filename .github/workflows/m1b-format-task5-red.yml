name: Format M1-B Task 5 RED

on:
  push:
    branches:
      - feat/m1b-ingestion-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m1b-ingestion-hardening
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply project formatting
        run: |
          pnpm exec prettier --write packages/cli/tests/unit/policy-flags.test.ts
          rm .github/workflows/m1b-format-task5-red.yml
      - name: Commit formatted RED test
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/cli/tests/unit/policy-flags.test.ts .github/workflows/m1b-format-task5-red.yml
          git commit -m "style: format M1-B CLI policy tests"
          git push origin HEAD:feat/m1b-ingestion-hardening

name: M3-B1 Task 6 Finalize

on:
  push:
    branches:
      - feat/m3b1-review-workspace-integration
    paths:
      - .github/workflows/m3b1-task6-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m3b1-task6-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/m3b1-review-workspace-integration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.24.0

      - name: Decode and validate Task 6 payloads
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .m3b1-task6-red.patch.gz.b64 | gzip --decompress > /tmp/m3b1-task6-red.patch
          base64 --decode .m3b1-task6-green.patch.gz.b64 | gzip --decompress > /tmp/m3b1-task6-green.patch
          git apply --check --verbose /tmp/m3b1-task6-red.patch
          git apply --check --verbose /tmp/m3b1-task6-green.patch
          pnpm install --frozen-lockfile --reporter=append-only

      - name: Apply and prove Task 6 RED contracts
        shell: bash
        run: |
          set -euo pipefail
          git apply --verbose /tmp/m3b1-task6-red.patch
          pnpm exec prettier --write \
            apps/web/src/app.test.tsx \
            apps/web/src/review/review-session-context.test.tsx \
            apps/web/src/review/review-workspace.test.tsx \
            apps/web/src/workspace/workspace-navigation.test.tsx \
            apps/web/src/workspace/workspace-shell.test.tsx
          git diff --check
          set +e
          pnpm --filter @api-schema-flow/web exec vitest run \
            src/app.test.tsx \
            src/workspace/workspace-shell.test.tsx \
            src/workspace/workspace-navigation.test.tsx \
            src/review/review-session-context.test.tsx \
            src/review/review-workspace.test.tsx \
            > /tmp/m3b1-task6-red.log 2>&1
          status=$?
          set -e
          cat /tmp/m3b1-task6-red.log
          test "$status" -ne 0
          grep -Eiq 'workspace-shell|workspace-navigation|review-session-context|review-workspace|Cannot find module|Failed to resolve import' /tmp/m3b1-task6-red.log
          echo 'Task 6 RED confirmed: workspace composition modules are required.'

      - name: Commit Task 6 RED tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/src/app.test.tsx \
            apps/web/src/review/review-session-context.test.tsx \
            apps/web/src/review/review-workspace.test.tsx \
            apps/web/src/workspace/workspace-navigation.test.tsx \
            apps/web/src/workspace/workspace-shell.test.tsx
          git diff --cached --check
          git commit -m 'test(web): define Task 6 workspace composition contracts'

      - name: Apply Task 6 GREEN implementation
        shell: bash
        run: |
          set -euo pipefail
          git apply --verbose /tmp/m3b1-task6-green.patch
          pnpm exec prettier --write \
            apps/web/src/app.tsx \
            apps/web/src/app.test.tsx \
            apps/web/src/styles.css \
            apps/web/src/review/review-session-context.tsx \
            apps/web/src/review/review-session-context.test.tsx \
            apps/web/src/review/review-workspace.tsx \
            apps/web/src/review/review-workspace.test.tsx \
            apps/web/src/workspace/workspace-navigation.tsx \
            apps/web/src/workspace/workspace-navigation.test.tsx \
            apps/web/src/workspace/workspace-shell.tsx \
            apps/web/src/workspace/workspace-shell.test.tsx
          git diff --check

      - name: Remove temporary delivery infrastructure
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/m3b1-task6-finalize.yml
          rm -f .github/workflows/m3b1-task6-source-export.yml
          rm -f .m3b1-task6-red.patch.gz.b64
          rm -f .m3b1-task6-green.patch.gz.b64
          find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/m3b1-task6-final-workflows.txt
          cat /tmp/m3b1-task6-final-workflows.txt
          diff -u <(printf '%s\n' ci.yml m3b1-ci.yml m3b1-source-export.yml) /tmp/m3b1-task6-final-workflows.txt

      - name: Verify Task 6 GREEN and full repository regression
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @api-schema-flow/web exec vitest run \
            src/app.test.tsx \
            src/workspace/workspace-shell.test.tsx \
            src/workspace/workspace-navigation.test.tsx \
            src/review/review-session-context.test.tsx \
            src/review/review-workspace.test.tsx
          pnpm --filter @api-schema-flow/web test
          pnpm --filter @api-schema-flow/web typecheck
          pnpm --filter @api-schema-flow/web build
          pnpm ci:verify
          pnpm check:web-fixture
          pnpm check:review-browser-bundle
          pnpm check:web-bundle
          pnpm boundaries:check
          git diff --check

      - name: Commit Task 6 production and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add \
            apps/web/src/app.tsx \
            apps/web/src/styles.css \
            apps/web/src/review/review-session-context.tsx \
            apps/web/src/review/review-workspace.tsx \
            apps/web/src/workspace/workspace-navigation.tsx \
            apps/web/src/workspace/workspace-shell.tsx
          git add -u -- \
            .github/workflows/m3b1-task6-finalize.yml \
            .github/workflows/m3b1-task6-source-export.yml \
            .m3b1-task6-red.patch.gz.b64 \
            .m3b1-task6-green.patch.gz.b64
          git diff --cached --check
          git commit -m 'refactor(web): add review-ready workspace composition'
          test -z "$(git status --porcelain)"
          git log --oneline -3
          git push origin HEAD:feat/m3b1-review-workspace-integration

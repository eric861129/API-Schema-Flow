name: M3-B1 Task 5 Development Export

on:
  push:
    branches:
      - feat/m3b1-review-workspace-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3b1-task5-dev-export
  cancel-in-progress: true

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/m3b1-review-workspace-integration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.24.0

      - name: Apply approved Task 3 and Task 4 production patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .m3b1-task4-green.patch.gz.b64 | gzip --decompress > /tmp/m3b1-task4-green.patch
          git apply --check /tmp/m3b1-task4-green.patch
          git apply /tmp/m3b1-task4-green.patch
          pnpm install --frozen-lockfile

      - name: Format recovered production files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            package.json \
            apps/web/package.json \
            pnpm-lock.yaml \
            packages/review/package.json \
            packages/review/src/browser.ts \
            packages/review/tests/unit/browser-entry.test.ts \
            packages/review/tests/integration/browser-parity.integration.test.ts \
            tooling/scripts/check-review-browser-bundle.mjs \
            tooling/scripts/check-boundaries.mjs \
            tooling/scripts/generate-web-workspace.mjs \
            tooling/scripts/check-web-workspace.mjs \
            apps/web/src/data/types.ts \
            apps/web/src/data/load-workspace.ts \
            apps/web/src/data/load-workspace.test.ts \
            apps/web/src/test/review-workspace-fixture.ts \
            apps/web/src/app.tsx \
            apps/web/src/app.test.tsx \
            apps/web/src/components/operations-panel.tsx \
            apps/web/src/workspace/operation-view-model.ts \
            apps/web/src/workspace/operation-view-model.test.ts \
            apps/web/src/graph/flow-canvas.tsx \
            apps/web/src/inspector/inspector-panel.tsx \
            apps/web/src/outline/outline-view.tsx
          git diff --check

      - name: Run recovered prerequisite verification
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/task5-prerequisite-build.log
          pnpm --filter @api-schema-flow/review test 2>&1 | tee /tmp/task5-prerequisite-review-unit.log
          pnpm --filter @api-schema-flow/review test:integration 2>&1 | tee /tmp/task5-prerequisite-review-integration.log
          pnpm --filter @api-schema-flow/web test 2>&1 | tee /tmp/task5-prerequisite-web-test.log
          pnpm --filter @api-schema-flow/web typecheck 2>&1 | tee /tmp/task5-prerequisite-web-typecheck.log
          pnpm check:review-browser-bundle 2>&1 | tee /tmp/task5-prerequisite-review-bundle.log
          pnpm check:web-bundle 2>&1 | tee /tmp/task5-prerequisite-web-bundle.log
          pnpm boundaries:check 2>&1 | tee /tmp/task5-prerequisite-boundaries.log

      - name: Package isolated dependency-ready workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .git
          tar -czf /tmp/api-schema-flow-m3b1-task5-dev.tgz \
            --exclude='.turbo' \
            --exclude='**/.turbo' \
            --exclude='**/dist' \
            --exclude='**/coverage' \
            .
          tar -czf /tmp/api-schema-flow-m3b1-task5-logs.tgz /tmp/task5-prerequisite-*.log 2>/dev/null || true

      - name: Upload dependency-ready workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-schema-flow-m3b1-task5-dev
          path: |
            /tmp/api-schema-flow-m3b1-task5-dev.tgz
            /tmp/api-schema-flow-m3b1-task5-logs.tgz
          retention-days: 1
          if-no-files-found: error

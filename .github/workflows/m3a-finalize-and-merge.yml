name: M3-A Finalize and Merge

on:
  push:
    branches:
      - feat/m3a-read-only-web-workspace
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: m3a-finalize-and-merge
  cancel-in-progress: false

jobs:
  finalize-verify-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      TURBO_TELEMETRY_DISABLED: '1'
      CI: '1'
    steps:
      - name: Check whether M3-A is already merged
        id: state
        shell: bash
        run: |
          set -euo pipefail
          merged="$(gh api repos/${GITHUB_REPOSITORY}/pulls/13 --jq '.merged')"
          echo "merged=${merged}" >> "$GITHUB_OUTPUT"

      - name: Check out M3-A branch
        if: steps.state.outputs.merged != 'true'
        uses: actions/checkout@v6
        with:
          ref: feat/m3a-read-only-web-workspace
          fetch-depth: 0

      - name: Reconstruct staged implementation when present
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.m3a-upload/part-*)
          if ((${#parts[@]} > 0)); then
            printf 'Found %s staged M3-A payload part(s).\n' "${#parts[@]}"
            cat "${parts[@]}" > /tmp/m3a.payload
            patch=/tmp/m3a.patch
            if base64 --decode /tmp/m3a.payload > /tmp/m3a.payload.gz 2>/dev/null && gzip -t /tmp/m3a.payload.gz 2>/dev/null; then
              gzip --decompress --stdout /tmp/m3a.payload.gz > "$patch"
            elif git apply --check /tmp/m3a.payload 2>/dev/null; then
              cp /tmp/m3a.payload "$patch"
            else
              echo 'The staged M3-A payload is neither a valid base64+gzip patch nor a plain Git patch.' >&2
              exit 1
            fi

            if git apply --check "$patch"; then
              git apply "$patch"
            elif git apply --reverse --check "$patch"; then
              echo 'The staged implementation is already present in the branch tree.'
            else
              echo 'The staged M3-A patch cannot be applied cleanly to the current branch.' >&2
              exit 1
            fi
          else
            echo 'No staged payload found; verifying the current branch tree directly.'
          fi

      - name: Remove one-time publication machinery
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .m3a-upload
          find .github/workflows -maxdepth 1 -type f -name 'm3a-*.yml' -delete
          git diff --check

      - name: Require complete M3-A surface
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          required=(
            apps/web/package.json
            apps/web/src/app.tsx
            apps/web/public/fixtures/reservation-workspace.json
            packages/domain/src/workspace-snapshot.ts
            packages/layout/src/index.ts
            tooling/scripts/generate-web-workspace.mjs
            tooling/scripts/check-web-workspace.mjs
            tooling/scripts/check-web-bundle.mjs
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required M3-A file: $path" >&2; exit 1; }
          done
          node - <<'NODE'
          const pkg = require('./package.json')
          const required = [
            'dev:web',
            'build:web',
            'test:web',
            'test:web:e2e',
            'generate:web-fixture',
            'check:web-fixture',
            'check:web-bundle',
          ]
          for (const name of required) {
            if (typeof pkg.scripts?.[name] !== 'string') {
              throw new Error(`Missing required root script: ${name}`)
            }
          }
          NODE
          test "$(find apps/web/src -type f \( -name '*.ts' -o -name '*.tsx' \) | wc -l)" -ge 15
          test "$(find apps/web -type f -path '*/e2e/*' -name '*.ts' | wc -l)" -ge 1
          test "$(find packages/layout/src -type f -name '*.ts' | wc -l)" -ge 2

      - name: Set up pnpm
        if: steps.state.outputs.merged != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        if: steps.state.outputs.merged != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        if: steps.state.outputs.merged != 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: steps.state.outputs.merged != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete pre-merge gate
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm workspace:check
          pnpm format:check
          pnpm lint
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm test:integration
          pnpm test:flow-fixtures
          pnpm test:inference-benchmark
          pnpm test:inference-performance
          pnpm test:review
          pnpm test:export-arazzo
          pnpm test:review-export-fixtures
          pnpm check:web-fixture
          pnpm build:web
          pnpm check:web-bundle
          pnpm test:web
          pnpm test:web:e2e
          pnpm boundaries:check
          git diff --check

      - name: Verify M3-A invariants
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .m3a-upload
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'm3a-*.yml' -print)"
          test "$(wc -c < apps/web/public/fixtures/reservation-workspace.json)" -lt 256000
          ! grep -RniE 'synthetic-jwt-token|synthetic-password|Bearer[[:space:]]+[A-Za-z0-9._~-]{12,}' \
            apps/web/public/fixtures/reservation-workspace.json apps/web/dist
          ! grep -RniE '(/Users/|/home/runner/|[A-Za-z]:\\Users\\)' \
            apps/web/public/fixtures/reservation-workspace.json
          node - <<'NODE'
          const fs = require('node:fs')
          const snapshot = JSON.parse(fs.readFileSync('apps/web/public/fixtures/reservation-workspace.json', 'utf8'))
          if (snapshot.schemaVersion !== '1.0') throw new Error('Unexpected snapshot version')
          if (snapshot.acceptedGraph?.nodes?.length !== 4) throw new Error('Canonical workspace must contain 4 endpoint nodes')
          if (!Array.isArray(snapshot.acceptedGraph?.edges) || snapshot.acceptedGraph.edges.length < 3) {
            throw new Error('Canonical workspace must contain at least 3 accepted relationships')
          }
          if (snapshot.acceptedGraph.edges.some((edge) => edge.status !== 'accepted')) {
            throw new Error('Candidate or rejected edge leaked into accepted graph')
          }
          NODE

      - name: Commit verified final tree
        if: steps.state.outputs.merged != 'true'
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalization changes were required.'
          else
            git commit -m 'feat: complete M3-A read-only Web workspace'
          fi
          head_sha="$(git rev-parse HEAD)"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          git push origin HEAD:feat/m3a-read-only-web-workspace

      - name: Mark PR ready and squash merge exact head
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          head_sha="${{ steps.commit.outputs.head_sha }}"
          gh pr ready 13 --repo "$GITHUB_REPOSITORY"
          gh api -X PATCH repos/${GITHUB_REPOSITORY}/pulls/13 \
            -f body="M3-A complete and owner-approved. Exact head ${head_sha} passed the full M0–M3-A merge gate in https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The final tree contains no staged upload payload or temporary M3-A workflow."
          gh api -X PUT repos/${GITHUB_REPOSITORY}/pulls/13/merge \
            -f merge_method=squash \
            -f sha="$head_sha" \
            -f commit_title='feat: add M3-A read-only Web workspace' \
            -f commit_message='Add the deterministic browser-safe workspace snapshot, framework-neutral ELK layout, simplified read-only React topology workspace, operation discovery, inspectors, accessible outline, responsive behavior, and complete browser verification.'

      - name: Verify merged main tree
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          test ! -e .m3a-upload
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'm3a-*.yml' -print)"
          pnpm install --frozen-lockfile
          pnpm workspace:check
          pnpm format:check
          pnpm lint
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm test:integration
          pnpm check:web-fixture
          pnpm build:web
          pnpm check:web-bundle
          pnpm test:web
          pnpm test:web:e2e
          pnpm boundaries:check
          git diff --check

      - name: Record completion on PR
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          gh pr comment 13 --repo "$GITHUB_REPOSITORY" --body "M3-A was squash-merged after the exact branch head and the resulting main tree both passed the complete verification gate. Evidence: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."

      - name: Record failure without merging
        if: failure() && steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          gh pr comment 13 --repo "$GITHUB_REPOSITORY" --body "M3-A finalization stopped before a successful completion. Inspect https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. No completion claim should be made until the failing gate is corrected."

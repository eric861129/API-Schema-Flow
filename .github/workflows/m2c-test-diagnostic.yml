name: Diagnose M2-C inference tests

on:
  push:
    branches:
      - feat/m2c-inference-core
    paths:
      - .github/workflows/m2c-test-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m2c-inference-core
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Capture focused inference failures
        shell: bash
        run: |
          set +e
          pnpm --filter @api-schema-flow/inference test > /tmp/m2c-test.log 2>&1
          status=$?
          {
            echo "exit_code=$status"
            echo
            grep -E "(FAIL|AssertionError|TypeError|expected|Received|Expected|Test Files|Tests )" /tmp/m2c-test.log | tail -n 160
            echo
            echo "--- tail ---"
            tail -n 220 /tmp/m2c-test.log
          } > docs/.m2c-test-failure.txt
          exit 0
      - name: Commit diagnostic summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.m2c-test-failure.txt
          git commit -m "chore: capture M2-C test diagnostic"
          git push

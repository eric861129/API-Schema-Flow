name: M3-B1 Merge Gate Repair

on:
  push:
    branches:
      - feat/m3b1-review-session
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m3b1-merge-gate-repair
  cancel-in-progress: false

jobs:
  repair-verify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - name: Check out M3-B1 branch
        uses: actions/checkout@v6
        with:
          ref: feat/m3b1-review-session
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair merge-gate and interaction defects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              if old not in source:
                  if new in source:
                      return
                  raise SystemExit(f'Expected patch marker was not found in {path}')
              file.write_text(source.replace(old, new, 1), encoding='utf-8')

          replace_once(
              '.github/workflows/m3b1-ci.yml',
              'test -f apps/web/src/workspace/workspace-shell.tsx',
              'test -f apps/web/src/app.tsx',
          )

          replace_once(
              'apps/web/src/test/setup.ts',
              "import '@testing-library/jest-dom/vitest'\n",
              "import '@testing-library/jest-dom/vitest'\nimport { cleanup } from '@testing-library/react'\nimport { afterEach } from 'vitest'\n\nafterEach(() => cleanup())\n",
          )

          replace_once(
              'apps/web/src/review/candidate-list.tsx',
              "function confidenceLabel(candidate: ReviewCandidateRow): string {\n  return `${candidate.band[0]?.toUpperCase()}${candidate.band.slice(1)} · ${Math.round(candidate.confidence * 100)}%`\n}\n",
              "function confidenceLabel(candidate: ReviewCandidateRow): string {\n  return `${candidate.band[0]?.toUpperCase()}${candidate.band.slice(1)} · ${Math.round(candidate.confidence * 100)}%`\n}\n\nfunction candidateAccessibleLabel(candidate: ReviewCandidateRow): string {\n  const blockers =\n    candidate.blockerCount > 0\n      ? `; ${candidate.blockerCount} blocker${candidate.blockerCount === 1 ? '' : 's'}`\n      : ''\n\n  return `Source ${candidate.sourceLabel} ${candidate.sourceSelector}; target ${candidate.targetLabel} ${candidate.targetDescriptor}; ${confidenceLabel(candidate)}; ${STATE_LABELS[candidate.state]}; ${candidate.evidenceCount} evidence${blockers}`\n}\n",
          )

          replace_once(
              'apps/web/src/review/candidate-list.tsx',
              "      case 'End':\n        event.preventDefault()\n        focusCandidate(candidateIds.length - 1)\n        break\n    }",
              "      case 'End':\n        event.preventDefault()\n        focusCandidate(candidateIds.length - 1)\n        break\n      case 'Enter':\n      case ' ': {\n        event.preventDefault()\n        const candidateId = candidateIds[index]\n        if (candidateId) onSelect(candidateId)\n        break\n      }\n    }",
          )

          replace_once(
              'apps/web/src/review/candidate-list.tsx',
              "            aria-selected={selected}\n            className=\"candidate-row\"",
              "            aria-selected={selected}\n            aria-label={candidateAccessibleLabel(candidate)}\n            className=\"candidate-row\"",
          )

          replace_once(
              'apps/web/src/review/candidate-list.test.tsx',
              "screen.getByRole('option', { name: /POST \\/reservations/i })",
              "screen.getByRole('option', { name: /^Source POST \\/reservations/i })",
          )

          replace_once(
              'apps/web/src/review/evidence-inspector.tsx',
              "      </dl>\n\n      {candidate.blockers.length > 0 ? (",
              "      </dl>\n\n      <p className=\"evidence-inspector__notice\">\n        This inference is a candidate, not an authoritative workflow fact.\n      </p>\n\n      {candidate.blockers.length > 0 ? (",
          )

          replace_once(
              'apps/web/src/review/evidence-inspector.test.tsx',
              "expect(screen.getByText(/candidate, not an authoritative/i)).not.toBeInTheDocument()",
              "expect(screen.getByText(/candidate, not an authoritative/i)).toBeVisible()",
          )
          PY

      - name: Format complete affected surface
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            .github/workflows/m3b1-ci.yml \
            apps/web/src/review \
            apps/web/src/test/setup.ts

      - name: Remove temporary repair workflow
        shell: bash
        run: rm -f .github/workflows/m3b1-merge-gate-repair.yml

      - name: Verify repaired interaction tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @api-schema-flow/web exec vitest run \
            src/review/candidate-list.test.tsx \
            src/review/evidence-inspector.test.tsx

      - name: Verify repaired merge candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/src/app.tsx
          test -f apps/web/src/graph/flow-canvas.tsx
          test -f apps/web/src/outline/outline-view.tsx
          test -f apps/web/public/fixtures/reservation-workspace.json
          test -f packages/layout/src/index.ts
          test -f packages/domain/src/workspace-snapshot.ts
          test ! -e .m3a-upload
          test -z "$(find .github/workflows -maxdepth 1 -type f \( -name 'm3a-*.yml' -o -name 'm3a-*.yaml' -o -name 'm3b1-merge-gate-repair.yml' \) -print)"
          pnpm format:check
          pnpm ci:verify
          pnpm check:web-fixture
          pnpm build:web
          pnpm check:web-bundle
          pnpm --filter @api-schema-flow/web exec vitest run \
            src/review/review-session.test.ts \
            src/review/review-selectors.test.ts \
            src/review/candidate-list.test.tsx \
            src/review/review-detail.test.ts \
            src/review/mapping-preview.test.tsx \
            src/review/evidence-inspector.test.tsx
          pnpm --filter @api-schema-flow/web typecheck
          pnpm --filter @api-schema-flow/web build
          git diff --check

      - name: Commit exact verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: satisfy M3-B1 merge gates'
          git push origin HEAD:feat/m3b1-review-session

name: M3-B1 Task 2 Secret Debug

on:
  push:
    branches:
      - feat/m3b1-review-workspace-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3b1-task2-secret-debug
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m3b1-review-workspace-integration
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Locate representative values without printing them
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'
          import { processOpenApi } from './packages/openapi/dist/index.js'

          const contents = await readFile('fixtures/review/reservation/openapi.yaml', 'utf8')
          const result = await processOpenApi({
            uri: 'fixture://reservation/openapi.yaml',
            contents,
            mediaType: 'application/yaml',
            byteLength: Buffer.byteLength(contents),
          })
          const matches = []
          function visit(value, path = '$') {
            if (typeof value === 'string') {
              if (/synthetic-jwt-token|synthetic-password|Bearer\s+[A-Za-z0-9._~-]{12,}/i.test(value)) {
                matches.push(path)
              }
              return
            }
            if (Array.isArray(value)) {
              value.forEach((item, index) => visit(item, `${path}[${index}]`))
              return
            }
            if (value && typeof value === 'object') {
              for (const [key, item] of Object.entries(value)) visit(item, `${path}.${key}`)
            }
          }
          visit(result)
          console.log(JSON.stringify(matches, null, 2))
          if (matches.length === 0) throw new Error('Expected at least one representative value')
          NODE

name: Format M1-B Task 5 GREEN

on:
  push:
    branches:
      - feat/m1b-ingestion-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m1b-ingestion-hardening
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply project formatting
        run: |
          pnpm exec prettier --write packages/cli/bin/schema-flow.mjs packages/cli/src/validate-command.ts packages/cli/src/validate-options.ts packages/cli/tests/unit/run-cli.test.ts
          rm .github/workflows/m1b-format-task5-green.yml
      - name: Commit formatted sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/cli/bin/schema-flow.mjs packages/cli/src/validate-command.ts packages/cli/src/validate-options.ts packages/cli/tests/unit/run-cli.test.ts .github/workflows/m1b-format-task5-green.yml
          git commit -m "style: format M1-B CLI policy implementation"
          git push origin HEAD:feat/m1b-ingestion-hardening

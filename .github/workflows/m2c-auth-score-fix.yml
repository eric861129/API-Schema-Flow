name: Calibrate M2-C bearer confidence

on:
  push:
    branches:
      - feat/m2c-inference-core
    paths:
      - .github/workflows/m2c-auth-score-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m2c-inference-core
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Calibrate explicit bearer evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/inference/src/rules.ts')
          text = path.read_text()
          old = "'INF-AUTH-BEARER',\n        'positive',\n        65,"
          new = "'INF-AUTH-BEARER',\n        'positive',\n        68,"
          if old not in text:
              raise SystemExit('expected bearer evidence block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write packages/inference/src/rules.ts
          rm .github/workflows/m2c-auth-score-fix.yml
      - name: Commit calibration and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/inference/src/rules.ts .github/workflows/m2c-auth-score-fix.yml
          git commit -m "fix(inference): calibrate explicit bearer confidence"
          git push

name: Apply M1-B Task 3 formatting

on:
  push:
    branches:
      - feat/m1b-ingestion-hardening

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m1b-ingestion-hardening
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/openapi/src/fingerprint.ts packages/openapi/src/parse-structured-document.ts packages/openapi/src/process-openapi.ts packages/openapi/src/reference-graph.ts
      - name: Commit formatting and remove workflow
        run: |
          rm .github/workflows/m1b-task3-format-preview.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/openapi/src .github/workflows/m1b-task3-format-preview.yml
          git commit -m "style(openapi): format reference graph implementation"
          git push origin HEAD:feat/m1b-ingestion-hardening

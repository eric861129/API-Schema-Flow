name: M2-A unused import autofix

on:
  push:
    branches:
      - feat/m2a-arazzo-core
    paths:
      - .github/workflows/m2a-unused-import-autofix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m2a-arazzo-core
      - name: Remove unused type import
        run: sed -i '/^  PreservedRecord,$/d' packages/arazzo/src/normalize-arazzo.ts
      - name: Commit fix
        run: |
          if git diff --quiet -- packages/arazzo/src/normalize-arazzo.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/arazzo/src/normalize-arazzo.ts
          git commit -m "fix(arazzo): remove unused normalizer import"
          git push

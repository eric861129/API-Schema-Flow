name: M3-A Complete and Merge v2

on:
  push:
    branches:
      - feat/m3a-read-only-web-workspace
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: m3a-complete-and-merge-v2
  cancel-in-progress: false

jobs:
  complete-verify-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      TURBO_TELEMETRY_DISABLED: '1'
      CI: '1'
    steps:
      - name: Check current PR state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          merged="$(gh api repos/${GITHUB_REPOSITORY}/pulls/13 --jq '.merged')"
          echo "merged=${merged}" >> "$GITHUB_OUTPUT"

      - name: Check out M3-A branch
        if: steps.state.outputs.merged != 'true'
        uses: actions/checkout@v6
        with:
          ref: feat/m3a-read-only-web-workspace
          fetch-depth: 0

      - name: Materialize M3-A implementation
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tooling/scripts/fix-m3a-scaffold.mjs
          node tooling/scripts/scaffold-m3a-implementation.mjs
          mkdir -p apps/web/public/fixtures
          rm -rf .m3a-upload
          find .github/workflows -maxdepth 1 -type f -name 'm3a-*.yml' -delete
          rm -f tooling/scripts/scaffold-m3a-implementation.mjs tooling/scripts/fix-m3a-scaffold.mjs

      - name: Set up pnpm
        if: steps.state.outputs.merged != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        if: steps.state.outputs.merged != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install frozen dependencies
        if: steps.state.outputs.merged != 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate and format canonical fixture
        if: steps.state.outputs.merged != 'true'
        run: |
          pnpm generate:web-fixture
          pnpm format

      - name: Install Playwright Chromium
        if: steps.state.outputs.merged != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete pre-merge verification
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm workspace:check
          pnpm format:check
          pnpm lint
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm test:integration
          pnpm test:flow-fixtures
          pnpm test:inference-benchmark
          pnpm test:inference-performance
          pnpm test:review
          pnpm test:export-arazzo
          pnpm test:review-export-fixtures
          pnpm check:web-fixture
          pnpm build:web
          pnpm check:web-bundle
          pnpm test:web
          pnpm test:web:e2e
          pnpm boundaries:check
          git diff --check

      - name: Verify product and publication invariants
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .m3a-upload
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'm3a-*.yml' -print)"
          test ! -e tooling/scripts/scaffold-m3a-implementation.mjs
          test ! -e tooling/scripts/fix-m3a-scaffold.mjs
          test "$(wc -c < apps/web/public/fixtures/reservation-workspace.json)" -lt 256000
          ! grep -RniE 'synthetic-jwt-token|synthetic-password|Bearer[[:space:]]+[A-Za-z0-9._~-]{12,}' apps/web/public/fixtures/reservation-workspace.json apps/web/dist
          ! grep -RniE '(/Users/|/home/runner/|[A-Za-z]:\\Users\\)' apps/web/public/fixtures/reservation-workspace.json
          node - <<'NODE'
          const fs = require('node:fs')
          const snapshot = JSON.parse(fs.readFileSync('apps/web/public/fixtures/reservation-workspace.json', 'utf8'))
          if (snapshot.schemaVersion !== '1.0') throw new Error('Unexpected snapshot version')
          if (snapshot.acceptedGraph.nodes.length !== 4) throw new Error('Expected four endpoint nodes')
          if (snapshot.acceptedGraph.edges.length !== 3) throw new Error('Expected three accepted relationships')
          if (snapshot.acceptedGraph.edges.some((edge) => edge.status !== 'accepted')) throw new Error('Non-accepted edge leaked into workspace')
          NODE

      - name: Commit and publish exact verified head
        if: steps.state.outputs.merged != 'true'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete M3-A read-only Web workspace'
          head_sha="$(git rev-parse HEAD)"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          git push origin HEAD:feat/m3a-read-only-web-workspace

      - name: Mark ready and squash merge
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          head_sha="${{ steps.publish.outputs.head_sha }}"
          gh pr ready 13 --repo "$GITHUB_REPOSITORY"
          gh api -X PATCH repos/${GITHUB_REPOSITORY}/pulls/13 \
            -f body="M3-A is complete and owner-approved. Exact head ${head_sha} passed the full M0–M3-A verification gate in https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The final tree contains no staged upload payload or temporary M3-A workflow."
          gh api -X PUT repos/${GITHUB_REPOSITORY}/pulls/13/merge \
            -f merge_method=squash \
            -f sha="$head_sha" \
            -f commit_title='feat: add M3-A read-only Web workspace' \
            -f commit_message='Add a deterministic browser-safe workspace snapshot, framework-neutral ELK layout, simplified read-only React topology workspace, operation discovery, inspectors, accessible outline, responsive behavior, and browser verification.'

      - name: Verify merged main tree
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          test ! -e .m3a-upload
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'm3a-*.yml' -print)"
          pnpm install --frozen-lockfile
          pnpm workspace:check
          pnpm format:check
          pnpm lint
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm test:integration
          pnpm check:web-fixture
          pnpm build:web
          pnpm check:web-bundle
          pnpm test:web
          pnpm test:web:e2e
          pnpm boundaries:check
          git diff --check

      - name: Record success
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          gh pr comment 13 --repo "$GITHUB_REPOSITORY" --body "M3-A was squash-merged only after both the exact branch tree and resulting main tree passed the complete verification gate. Evidence: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."

      - name: Record stopped gate
        if: failure() && steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          gh pr comment 13 --repo "$GITHUB_REPOSITORY" --body "M3-A completion v2 stopped at a failing verification gate. Inspect https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The workflow did not claim successful completion."

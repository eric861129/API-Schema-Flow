name: Format preview

on:
  push:
    branches:
      - feat/m0-m1a-foundation

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier patch
        run: |
          pnpm exec prettier packages/openapi/src/normalize-schema.ts > /tmp/normalize-schema.ts
          diff -u packages/openapi/src/normalize-schema.ts /tmp/normalize-schema.ts || true

name: M3-B1 Task 3 RED

on:
  push:
    branches:
      - feat/m3b1-review-workspace-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3b1-task3-red
  cancel-in-progress: true

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
      RED_PATCH_GZIP_BASE64: ''
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/m3b1-review-workspace-integration
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Build current packages
        run: pnpm build

      - name: Apply Task 3 tests only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          Path('/tmp/task3-red.patch').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['RED_PATCH_GZIP_BASE64']))
          )
          PY
          git apply --check /tmp/task3-red.patch
          git apply /tmp/task3-red.patch

      - name: Verify browser entry tests fail for the missing subpath
        shell: bash
        run: |
          set -uo pipefail
          pnpm --filter @api-schema-flow/review exec vitest run tests/unit/browser-entry.test.ts > /tmp/unit-red.log 2>&1
          unit_status=$?
          pnpm --filter @api-schema-flow/review exec vitest run tests/integration/browser-parity.integration.test.ts > /tmp/integration-red.log 2>&1
          integration_status=$?
          cat /tmp/unit-red.log
          cat /tmp/integration-red.log
          if [ "$unit_status" -eq 0 ] || [ "$integration_status" -eq 0 ]; then
            echo 'Task 3 RED tests unexpectedly passed before the browser entry existed.' >&2
            exit 1
          fi
          if ! grep -Eiq '@api-schema-flow/review/browser|browser.*(not found|resolve|export|subpath)|missing.*browser' /tmp/unit-red.log /tmp/integration-red.log; then
            echo 'Task 3 RED failure did not identify the missing browser entry.' >&2
            exit 1
          fi
          echo 'Task 3 RED confirmed: the browser subpath is missing.'

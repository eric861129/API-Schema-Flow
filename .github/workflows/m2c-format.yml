name: Format M2-C branch

on:
  push:
    branches:
      - feat/m2c-inference-core
    paths:
      - packages/domain/**
      - packages/inference/**
      - packages/cli/**
      - tooling/**
      - package.json
      - .github/workflows/m2c-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m2c-inference-core
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format existing M2-C paths
        run: |
          targets=(packages/domain packages/cli tooling package.json)
          if [ -d packages/inference ]; then
            targets+=(packages/inference)
          fi
          pnpm exec prettier --write "${targets[@]}"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain packages/cli tooling package.json
          if [ -d packages/inference ]; then
            git add packages/inference
          fi
          git commit -m "style(inference): apply repository formatting"
          git push

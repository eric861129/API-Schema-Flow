name: M3-A Development Workspace

on:
  push:
    branches:
      - feat/m3a-read-only-web-workspace
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3a-dev-workspace
  cancel-in-progress: true

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out M3-A branch
        uses: actions/checkout@v6
        with:
          ref: feat/m3a-read-only-web-workspace
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install current workspace
        run: pnpm install --frozen-lockfile

      - name: Package isolated development workspace
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.turbo \
            --exclude='**/.turbo' \
            --exclude='**/dist' \
            --exclude='**/coverage' \
            -czf /tmp/api-schema-flow-m3a-workspace.tgz .

      - name: Upload development workspace
        uses: actions/upload-artifact@v4
        with:
          name: api-schema-flow-m3a-workspace
          path: /tmp/api-schema-flow-m3a-workspace.tgz
          retention-days: 1
          if-no-files-found: error

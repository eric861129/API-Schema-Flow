name: Regenerate deterministic M2-B Golden Files

on:
  push:
    branches:
      - feat/m2b-declared-flow-graph
    paths:
      - .prettierignore
      - .github/workflows/m2b-raw-golden.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/m2b-declared-flow-graph
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @api-schema-flow/flow generate:fixtures
      - name: Commit raw Golden Files and remove this workflow
        run: |
          rm .github/workflows/m2b-raw-golden.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/flow/declared .github/workflows/m2b-raw-golden.yml
          git commit -m "test(flow): restore deterministic Golden serialization"
          git push

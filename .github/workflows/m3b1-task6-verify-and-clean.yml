name: M3-B1 Task 6 Verify and Clean

on:
  push:
    branches:
      - feat/m3b1-review-workspace-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m3b1-task6-verify-and-clean
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v6
        with:
          ref: feat/m3b1-review-workspace-integration
          fetch-depth: 0

      - name: Verify Task 6 source shape
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find apps/web/src -type f -name 'workspace-shell.tsx' -print -quit)"
          grep -Rq --include='*.tsx' 'ReviewSessionProvider' apps/web/src
          grep -Rq --include='*.tsx' 'Inference Review' apps/web/src
          grep -q 'WorkspaceShell' apps/web/src/app.tsx
          test "$(find apps/web/src -type f \( -name '*workspace-shell*.test.tsx' -o -name '*review-session-context*.test.tsx' -o -name '*inference-review*.test.tsx' \) | wc -l)" -ge 2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.24.0

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Verify Task 6 and full repository regression
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @api-schema-flow/web test
          pnpm --filter @api-schema-flow/web typecheck
          pnpm --filter @api-schema-flow/web build
          pnpm ci:verify
          pnpm check:web-fixture
          pnpm check:review-browser-bundle
          pnpm check:web-bundle
          pnpm boundaries:check
          git diff --check

      - name: Record verification and remove temporary delivery files
        shell: bash
        run: |
          set -euo pipefail
          implementation_head=$(git rev-parse HEAD)
          mkdir -p docs/reports
          cat > docs/reports/m3b1-task6-shell-navigation-verification.md <<EOF
          # M3-B1 Task 6 Workspace Shell and Navigation Verification

          Task 6 extracts the ready-state workspace from \`App\`, adds real Topology, Outline, and Inference Review destinations, and wires the Task 5 review materialization/projection through a Review Session provider.

          Verified implementation head: \`${implementation_head}\`

          The gate verified all Web tests, Web typecheck, Web production build, full \`pnpm ci:verify\`, deterministic fixture checks, Review/Web browser bundle boundaries, package boundaries, and \`git diff --check\`.

          Scope remains limited to navigation, shell extraction, context composition, and a review destination skeleton. Candidate discovery UI and review mutation controls remain deferred to Tasks 7 and 8.
          EOF
          rm -f .task6-delivery-probe
          rm -f .github/TASK6_*.txt
          rm -f .m3b1-task6-red.patch.gz.b64 .m3b1-task6-green.patch.gz.b64
          rm -f .m3b1-task6-*.part-*
          rm -f .github/workflows/m3b1-task6-source-export.yml
          rm -f .github/workflows/m3b1-task6-finalize.yml
          rm -f .github/workflows/m3b1-task6-verify-and-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: record M3-B1 Task 6 verification and clean delivery files'
          git push origin HEAD:feat/m3b1-review-workspace-integration

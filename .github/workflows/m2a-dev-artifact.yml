name: M2-A development artifact

on:
  push:
    branches:
      - feat/m2a-arazzo-core
    paths:
      - .github/workflows/m2a-dev-artifact.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create development archive
        run: tar --exclude=.git --exclude='**/dist' -czf /tmp/m2a-dev.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: m2a-dev
          path: /tmp/m2a-dev.tar.gz
          retention-days: 1

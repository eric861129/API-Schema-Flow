name: M3-B1 Task 3 Finalize

on:
  push:
    branches:
      - feat/m3b1-review-workspace-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m3b1-task3-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/m3b1-review-workspace-integration
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install verified pnpm 11.24.0 release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pnpm-linux-x64.tar.gz"
          extract_dir="$RUNNER_TEMP/pnpm-linux-x64"
          curl --fail --location --silent --show-error --retry 5 \
            https://github.com/pnpm/pnpm/releases/download/v11.24.0/pnpm-linux-x64.tar.gz \
            --output "$archive"
          echo '0a9b76dedb5fe8cc5e7f3a9fd70854181cfb08a487ebaf0c9cfb044dc860936c  '"$archive" | sha256sum --check --strict
          mkdir -p "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir"
          pnpm_binary="$(find "$extract_dir" -type f -name pnpm -print -quit)"
          test -n "$pnpm_binary"
          echo "$(dirname "$pnpm_binary")" >> "$GITHUB_PATH"
          "$pnpm_binary" --version

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Task 3 implementation and lint-equivalent repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/m3b1-task3-green.yml').read_text()
          payload = re.search(r"GREEN_PATCH_GZIP_BASE64:\s*'([^']+)'", workflow)
          if payload is None:
              raise SystemExit('Missing Task 3 implementation payload')
          Path('/tmp/task3-green.patch').write_bytes(
              gzip.decompress(base64.b64decode(payload.group(1)))
          )
          PY
          git apply --check /tmp/task3-green.patch
          git apply /tmp/task3-green.patch

          python - <<'PY'
          from pathlib import Path

          bundle = Path('tooling/scripts/check-review-browser-bundle.mjs')
          text = bundle.read_text()
          old = "      throw new Error(`Prohibited Review browser dependency marker: ${marker}`)"
          new = "      throw new Error(`Prohibited Review browser dependency marker: ${marker}`, { cause: error })"
          if text.count(old) != 1:
              raise SystemExit('Expected one Review bundle symptom error')
          bundle.write_text(text.replace(old, new))

          generator = Path('tooling/scripts/generate-web-workspace.mjs')
          text = generator.read_text()
          old_schema = """  const {
            example: _example,
            defaultValue: _defaultValue,
            properties,
            items,
            allOf,
            anyOf,
            oneOf,
            additionalProperties,
            ...rest
          } = schema
          """
          new_schema = """  const { properties, items, allOf, anyOf, oneOf, additionalProperties } = schema
            const rest = { ...schema }
            delete rest.example
            delete rest.defaultValue
            delete rest.properties
            delete rest.items
            delete rest.allOf
            delete rest.anyOf
            delete rest.oneOf
            delete rest.additionalProperties
          """
          old_media = """  const { example: _example, schema, ...rest } = mediaType
          """
          new_media = """  const { schema } = mediaType
            const rest = { ...mediaType }
            delete rest.example
            delete rest.schema
          """
          if text.count(old_schema) != 1:
              raise SystemExit('Expected one schema sanitization block')
          if text.count(old_media) != 1:
              raise SystemExit('Expected one media sanitization block')
          generator.write_text(text.replace(old_schema, new_schema).replace(old_media, new_media))
          PY

          pnpm exec prettier --write \
            package.json \
            packages/review/package.json \
            packages/review/src/browser.ts \
            packages/review/tests/unit/browser-entry.test.ts \
            packages/review/tests/integration/browser-parity.integration.test.ts \
            tooling/scripts/check-review-browser-bundle.mjs \
            tooling/scripts/check-boundaries.mjs \
            tooling/scripts/generate-web-workspace.mjs
          git diff --check

      - name: Run complete monorepo verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm ci:verify
          pnpm generate:web-fixture
          git diff --exit-code -- apps/web/public/fixtures/reservation-workspace.json
          pnpm check:web-fixture
          git diff --check

      - name: Prove browser bundle gate rejects Node built-ins
        shell: bash
        run: |
          set -euo pipefail
          cp packages/review/src/browser.ts /tmp/task3-browser.ts
          printf "\nexport { readFile as __task3NodeProbe } from 'node:fs'\n" >> packages/review/src/browser.ts
          pnpm --filter @api-schema-flow/review build
          set +e
          pnpm check:review-browser-bundle > /tmp/task3-bundle-negative.log 2>&1
          status=$?
          set -e
          cp /tmp/task3-browser.ts packages/review/src/browser.ts
          pnpm --filter @api-schema-flow/review build
          cat /tmp/task3-bundle-negative.log
          test "$status" -ne 0
          grep -Fxq 'Prohibited Review browser dependency marker: node:fs' /tmp/task3-bundle-negative.log
          pnpm check:review-browser-bundle

      - name: Prove Web Review rejects the package root
        shell: bash
        run: |
          set -euo pipefail
          cat > apps/web/src/review/__task3-boundary-probe.ts <<'EOF'
          import { resolveReviewDecisions } from '@api-schema-flow/review'

          void resolveReviewDecisions
          EOF
          set +e
          pnpm boundaries:check > /tmp/task3-boundary-negative.log 2>&1
          status=$?
          set -e
          rm apps/web/src/review/__task3-boundary-probe.ts
          cat /tmp/task3-boundary-negative.log
          test "$status" -ne 0
          grep -Fq '@api-schema-flow/review/browser' /tmp/task3-boundary-negative.log
          pnpm boundaries:check

      - name: Commit Task 3 and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/m3b1-task3-source-export.yml
          rm -f .github/workflows/m3b1-task3-red.yml
          rm -f .github/workflows/m3b1-task3-red-confirm.yml
          rm -f .github/workflows/m3b1-task3-green.yml
          rm -f .github/workflows/m3b1-task3-green-fix.yml
          rm -f .github/workflows/m3b1-task3-green-release.yml
          rm -f .github/workflows/m3b1-task3-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            package.json \
            packages/review/package.json \
            packages/review/src/browser.ts \
            packages/review/tests/unit/browser-entry.test.ts \
            packages/review/tests/integration/browser-parity.integration.test.ts \
            tooling/scripts/check-review-browser-bundle.mjs \
            tooling/scripts/check-boundaries.mjs \
            tooling/scripts/generate-web-workspace.mjs \
            .github/workflows/m3b1-task3-source-export.yml \
            .github/workflows/m3b1-task3-red.yml \
            .github/workflows/m3b1-task3-red-confirm.yml \
            .github/workflows/m3b1-task3-green.yml \
            .github/workflows/m3b1-task3-green-fix.yml \
            .github/workflows/m3b1-task3-green-release.yml \
            .github/workflows/m3b1-task3-finalize.yml
          git diff --cached --check
          git status --short
          git commit -m 'feat(review): expose browser-safe review semantics'
          git push origin HEAD:feat/m3b1-review-workspace-integration

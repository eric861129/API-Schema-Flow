name: M2-D Finalize and Merge

on:
  push:
    branches:
      - feat/m2d-review-export
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: m2d-finalize
  cancel-in-progress: false

jobs:
  verify-and-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out M2-D branch
        uses: actions/checkout@v6
        with:
          ref: feat/m2d-review-export
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Require complete M2-D implementation
        shell: bash
        run: |
          set -euo pipefail
          required=(
            packages/domain/src/review-decision.ts
            packages/review/src/parse-decision-set.ts
            packages/review/src/materialize-reviewed-graph.ts
            packages/exporter-arazzo/src/export-arazzo.ts
            packages/exporter-arazzo/src/mapping-projector.ts
            packages/cli/src/review-command.ts
            packages/cli/src/export-arazzo-command.ts
            fixtures/review/reservation/decision-set.json
            fixtures/review/reservation/workflow-plan.json
            fixtures/review/reservation/expected-reviewed-graph.json
            fixtures/review/reservation/expected-workflow.arazzo.yaml
            fixtures/review/reservation/expected-workflow.arazzo.json
            docs/reports/m2d-review-arazzo-export-verification.md
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required M2-D file: $path"; exit 1; }
          done

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete repository verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm workspace:check
          pnpm format:check
          pnpm lint
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm test:integration
          pnpm test:flow-fixtures
          pnpm benchmark:inference
          pnpm test:review
          pnpm test:export-arazzo
          pnpm test:review-export-fixtures
          pnpm boundaries:check
          git diff --check

      - name: Verify CLI review and Arazzo Golden output
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/bin/schema-flow.mjs review \
            fixtures/review/reservation/openapi.yaml \
            --decisions fixtures/review/reservation/decision-set.json \
            --json > /tmp/m2d-review.json

          node packages/cli/bin/schema-flow.mjs export-arazzo \
            fixtures/review/reservation/openapi.yaml \
            --decisions fixtures/review/reservation/decision-set.json \
            --workflow fixtures/review/reservation/workflow-plan.json \
            --format yaml > /tmp/m2d-workflow.yaml

          cmp /tmp/m2d-workflow.yaml fixtures/review/reservation/expected-workflow.arazzo.yaml
          node -e "const r=require('/tmp/m2d-review.json'); if (!r.valid || !r.graph || !Array.isArray(r.outcomes)) process.exit(1)"

      - name: Scan generated artifacts for representative secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'synthetic-jwt-token|synthetic-password|Bearer[[:space:]]+[A-Za-z0-9._~-]{12,}' \
            fixtures/review/reservation/expected-reviewed-graph.json \
            fixtures/review/reservation/expected-workflow.arazzo.yaml \
            fixtures/review/reservation/expected-workflow.arazzo.json; then
            echo 'Representative secret value found in generated M2-D artifact.'
            exit 1
          fi

      - name: Record final verification and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat >> docs/reports/m2d-review-arazzo-export-verification.md <<EOF

## Final remote merge gate

- Verification workflow: ${run_url}
- Verified source head: ${GITHUB_SHA}
- Node.js: 24
- pnpm: 11.24.0
- Frozen install, formatting, lint, build, typecheck, unit/integration tests, Flow Golden fixtures, M2-C inference benchmark, M2-D review/export suites, package boundaries, CLI review, exact Arazzo Golden comparison, secret scan, and git diff check all passed before this record was committed.
EOF
          rm .github/workflows/m2d-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reports/m2d-review-arazzo-export-verification.md .github/workflows/m2d-finalize.yml
          git commit -m 'docs: record final M2-D verification'

      - name: Reverify exact merge head after final documentation commit
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm lint
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm test:integration
          pnpm test:flow-fixtures
          pnpm benchmark:inference
          pnpm test:review
          pnpm test:export-arazzo
          pnpm test:review-export-fixtures
          pnpm boundaries:check
          git diff --check HEAD^

      - name: Push exact verified head
        run: git push origin HEAD:feat/m2d-review-export

      - name: Mark PR ready and merge M2-D
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          gh pr comment 12 --body "Final M2-D remote verification passed on exact merge head \`${head_sha}\`. Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh pr ready 12
          gh pr merge 12 --squash --match-head-commit "$head_sha" --delete-branch=false

      - name: Comment failure evidence
        if: failure()
        shell: bash
        run: |
          gh pr comment 12 --body "M2-D finalization stopped before merge. Inspect the failing step in https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The Draft PR remains unmerged."

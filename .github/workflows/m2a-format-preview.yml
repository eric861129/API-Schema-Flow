name: M2-A format preview

on:
  push:
    branches:
      - feat/m2a-arazzo-core

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier patches
        run: |
          for file in \
            packages/arazzo/tests/unit/runtime-expression.test.ts \
            packages/arazzo/tests/unit/runtime-template.test.ts; do
            pnpm exec prettier "$file" > "/tmp/$(basename "$file")"
            diff -u "$file" "/tmp/$(basename "$file")" || true
          done
